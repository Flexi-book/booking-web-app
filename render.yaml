services:
  - type: static
    name: flexibook-frontend
    rootDir: .
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AUTH_API_URL
        sync: false
      - key: VITE_CATALOG_API_URL
        sync: false
      - key: VITE_BOOKING_API_URL
        sync: false
      - key: VITE_BACKOFFICE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
